name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Release notes compare against previous tags and require the changelog section.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36, build tools, NDK and CMake
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER=$(command -v sdkmanager || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.31.1"

      - name: Build proot fast path
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CLANG="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          "$CLANG" \
            --target=aarch64-linux-gnu \
            -O2 -fPIC -shared -nostdlib -ffreestanding \
            -fvisibility=hidden -mno-outline-atomics -fno-stack-protector \
            -Wall -Wextra -Werror \
            -fuse-ld=lld -Wl,-z,now -Wl,--build-id=none \
            -o app/src/main/jniLibs/arm64-v8a/libfastpath.so \
            patches/proot/fastpath/fastpath.c

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing
        # Fork PRs cannot read repository secrets; Gradle falls back to the debug keystore.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p tools
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > tools/release.jks
            {
              echo "ANDROID_KEYSTORE_FILE=tools/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using keystore from repository secrets."
          else
            echo "::error::Signing secrets are missing. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
            exit 1
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test OWL compiler
        run: ./gradlew :owl:test :owl:owlJar --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced by the build." >&2
            exit 1
          fi
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]//g')
          SHORT_SHA="${GITHUB_SHA::7}"
          OUTPUT_NAME="Bellatrix-${VERSION}-${SHORT_SHA}.apk"
          cp "$APK_PATH" "$OUTPUT_NAME"
          echo "path=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          ls -lh "$OUTPUT_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bellatrix-release-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.apk.outputs.version }}
          VERSION_CODE: ${{ steps.apk.outputs.versionCode }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          HEADER="## [${VERSION}]"
          SECTION=$(awk -v header="$HEADER" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION. Add it before pushing tag $TAG."
            exit 1
          fi

          PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -n 1 || true)
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          {
            echo "# Bellatrix ${TAG}"
            echo
            echo "## What's New / Changelog"
            echo
            printf '%s\n' "$SECTION"
            echo
            echo "## Install"
            echo
            echo "- Android 6.0+ (API 23), arm64 device."
            echo "- Download \`$APK_NAME\` from this release and open it to install."
            echo "- Or open this release in Chrome and tap the APK asset."
            echo "- **PC Update → Check for updates** inside the launcher also reads this release."
            echo "- If replacing a build with a different signing certificate, uninstall it first."
            echo
            echo "## Verification"
            echo
            echo "- SHA-256: \`$SHA256\`"
            echo "- Version code: ${VERSION_CODE}"
            echo "- Signed and assembled by GitHub Actions only, from commit \`${GITHUB_SHA}\`."
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "## Full Changelog"
              echo
              echo "https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              echo "## Full Changelog"
              echo
              echo "https://github.com/${GITHUB_REPOSITORY}/commits/${TAG}"
            fi
          } > release-body.md
          cat release-body.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bellatrix ${{ github.ref_name }}
          body_path: release-body.md
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: false
